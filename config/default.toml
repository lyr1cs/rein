[database]
path = "auto"

[embedding]
provider = "google"
dimensions = 3072

[embedding.google]
model = "gemini-embedding-001"
# endpoint override for proxies (China, etc.)
# default: "https://generativelanguage.googleapis.com"
# endpoint = "https://your-proxy.example.com"

[embedding.omlx]
endpoint = "http://localhost:8000/v1"
model = "default"

[search]
rrf_k = 60.0
rrf_fts_weight = 0.3
rrf_vec_weight = 0.7
waterfall_fts_threshold = 0.5
dedup_similarity = 0.70
dedup_time_window_days = 7

[chunking]
max_tokens = 512
overlap_percent = 10
metadata_prefix = true

[sync]
supermemory_enabled = true
auto_memory_enabled = true
auto_memory_glob = "~/.claude/projects/*/memory/**/*.md"
# endpoint override for Supermemory API proxy
# default: "https://api.supermemory.ai"
# endpoint = "https://your-proxy.example.com"

[decay]
base_lambda = 0.06
ltm_beta = 0.8
stm_beta = 1.2
interval_hours = 24
prune_threshold = 0.05
stm_to_ltm_access_count = 5

[server]
compact = false
sse_enabled = false
sse_port = 8680
sse_bind = "127.0.0.1"    # use 0.0.0.0 for Tailscale/LAN access

[hooks]
min_turns = 20
context_before = 3
context_after = 1
max_items_per_session = 10
buffer_dir = "auto"  # auto = ~/.rein/  (session buffers stored here)
buffer_flush_threshold = 50000  # chars accumulated before mid-session extraction
                                # 50000 (~12K-25K tokens) for 1M models
                                # 10000 (~2.5K-5K tokens) for smaller models
                                # 0 = only extract at session end
signal_keywords = [
    # English
    "decided", "chose", "architecture", "design", "pattern",
    "bug", "fix", "fixed", "resolved", "error", "crash",
    "installed", "deployed", "migrated",
    "important", "remember", "solution", "tradeoff",
    "upgrade", "deprecated", "workflow", "released",
    "because", "reason", "switched", "selected", "prefer",
    "root cause", "workaround", "conclusion",
    # Chinese (for matching Chinese conversation content)
    "决策", "选型", "架构", "设计", "模式",
    "修复", "解决", "安装", "部署", "迁移",
    "重要", "记住", "记录", "方案", "权衡",
    "升级", "废弃", "流程", "发布",
]

[extract]
provider = "google"

[extract.google]
model = "gemini-3.1-flash-lite-preview"
max_input_chars = 0   # 0 = no truncation (1M token model). Set a limit if using a smaller model.
# endpoint defaults to "https://generativelanguage.googleapis.com"
# endpoint = "https://your-proxy.example.com"

[extract.omlx]
endpoint = "http://localhost:11434/v1"
model = "default"
max_input_chars = 16000  # ~4K-8K tokens, suitable for 7B-13B local models. Increase for larger models.
# Works with any OpenAI-compatible server:
# Ollama (http://localhost:11434/v1), LM Studio (http://localhost:1234/v1),
# vLLM, LocalAI, text-generation-webui, etc.
