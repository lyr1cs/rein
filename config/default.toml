[database]
path = "auto"

[embedding]
provider = "google"
dimensions = 3072

[embedding.google]
model = "gemini-embedding-001"
# endpoint override for proxies (China, etc.)
# default: "https://generativelanguage.googleapis.com"
# endpoint = "https://your-proxy.example.com"

[embedding.omlx]
endpoint = "http://localhost:8000/v1"
model = "default"

[search]
rrf_k = 60.0
rrf_fts_weight = 0.3
rrf_vec_weight = 0.7
waterfall_fts_threshold = 0.5
dedup_similarity = 0.70
dedup_time_window_days = 7

[chunking]
max_tokens = 512
overlap_percent = 10
metadata_prefix = true

[sync]
supermemory_enabled = true
auto_memory_enabled = true
auto_memory_glob = "~/.claude/projects/*/memory/**/*.md"
# endpoint override for Supermemory API proxy
# default: "https://api.supermemory.ai"
# endpoint = "https://your-proxy.example.com"

[decay]
base_lambda = 0.06
ltm_beta = 0.8
stm_beta = 1.2
interval_hours = 24
prune_threshold = 0.05
stm_to_ltm_access_count = 5

[server]
compact = false
sse_enabled = false
sse_port = 8680
sse_bind = "127.0.0.1"    # use 0.0.0.0 for Tailscale/LAN access

[hooks]
min_turns = 20
context_before = 3
context_after = 1
max_items_per_session = 10
