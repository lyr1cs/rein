[package]
name = "rein"
version = "0.1.0"
edition = "2021"
description = "Multi-source cross-validated memory for AI agents"
license = "MIT"

[dependencies]
rusqlite = { version = "0.34", features = ["bundled", "modern_sqlite"] }
sqlite-vec = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }
rmcp = { version = "1.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
glob = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
