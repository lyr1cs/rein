# v0.26.x fixture #1: every LLM consumer explicitly declares
# `[*.provider]` + `[*.google]` blocks. The most-redundant shape this
# covers — operators who set provider/model on every section
# independently. The Track 2 §8.4 doctor suggestion ("4+ sections share
# the same provider+model — consider [llm]") fires on this pattern.
#
# Back-compat invariant: `resolve_llm_for(...)` for every section here
# must return the SAME `(provider, model, endpoint)` it would have
# returned in v0.26.x via direct field access.

[database]
path = "/tmp/rein-fixture-01.db"

[embedding]
provider = "google"
dimensions = 3072

[embedding.google]
model = "gemini-embedding-001"

[embedding.omlx]
endpoint = "http://localhost:8000/v1"
model = "default"

[extract]
provider = "google"

[extract.google]
model = "gemini-3.1-flash-lite-preview"
max_input_chars = 0  # 1M-token model

[extract.omlx]
endpoint = "http://localhost:11434/v1"
model = "default"
max_input_chars = 16000

[query_expansion]
provider = "google"
max_expansions = 3

[query_expansion.google]
model = "gemini-3.1-flash-lite-preview"

[query_expansion.omlx]
endpoint = "http://localhost:8000/v1"
model = "default"

[search]
rrf_k = 60.0
rrf_fts_weight = 0.3
rrf_vec_weight = 0.7
dedup_similarity = 0.70
dedup_time_window_days = 7
llm_reranker = "google"
llm_reranker_top_n = 15

[chunking]
max_tokens = 512
overlap_percent = 10
metadata_prefix = true

[sync]
supermemory_enabled = false
auto_memory_enabled = false
auto_memory_glob = ""

[decay]
base_lambda = 0.06
ltm_beta = 0.8
stm_beta = 1.2
interval_hours = 24
prune_threshold = 0.05
stm_to_ltm_access_count = 5

[server]
compact = false
sse_enabled = false
sse_port = 8680
sse_bind = "127.0.0.1"

[ars]
llm_backend = "google"
recall_synthesis_enabled = true
concept_summary_enabled = true
cold_archive_enabled = true

[resummerize]
enabled = true
llm_backend = "google"

[async_memory]
provider = "google"

[intelligent_merge]
enabled = false
provider = "google"
