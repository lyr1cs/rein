[database]
path = "auto"

[embedding]
provider = "google"
dimensions = 3072

[embedding.google]
model = "gemini-embedding-001"
# endpoint override for proxies (China, etc.)
# default: "https://generativelanguage.googleapis.com"
# endpoint = "https://your-proxy.example.com"

[embedding.omlx]
endpoint = "http://localhost:8000/v1"
model = "default"

[search]
rrf_k = 60.0
rrf_fts_weight = 0.3
rrf_vec_weight = 0.7
dedup_similarity = 0.70
dedup_time_window_days = 7
llm_reranker = "none"         # "google", "omlx", or "none" — LLM-based reranking of top results
llm_reranker_top_n = 15       # Number of top candidates to rerank with LLM

[chunking]
max_tokens = 512
overlap_percent = 10
metadata_prefix = true

[sync]
supermemory_enabled = true
auto_memory_enabled = true
auto_memory_glob = "~/.claude/projects/*/memory/**/*.md"
# endpoint override for Supermemory API proxy
# default: "https://api.supermemory.ai"
# endpoint = "https://your-proxy.example.com"

[decay]
base_lambda = 0.06
ltm_beta = 0.8
stm_beta = 1.2
interval_hours = 24
prune_threshold = 0.05
stm_to_ltm_access_count = 5

[server]
compact = false
sse_enabled = false
sse_port = 8680
sse_bind = "127.0.0.1"    # use 0.0.0.0 for Tailscale/LAN access
# v0.27.4 F5/C1: default-deny. Operators must opt in to unauthenticated
# loopback or set REIN_HTTP_TOKEN. Existing fresh-install and
# file-backed configs that omit this field also resolve to false via
# the matching Rust struct default in `crates/rein/src/config.rs`.
allow_unauthenticated_loopback = false

[hooks]
min_turns = 20
context_before = 3
context_after = 1
max_items_per_session = 10
buffer_dir = "auto"  # auto = ~/.rein/  (session buffers stored here)
buffer_flush_threshold = 50000  # chars accumulated before mid-session extraction
                                # 50000 (~12K-25K tokens) for 1M models
                                # 10000 (~2.5K-5K tokens) for smaller models
                                # 0 = only extract at session end
signal_keywords = [
    # English
    "decided", "chose", "architecture", "design", "pattern",
    "bug", "fix", "fixed", "resolved", "error", "crash",
    "installed", "deployed", "migrated",
    "important", "remember", "solution", "tradeoff",
    "upgrade", "deprecated", "workflow", "released",
    "because", "reason", "switched", "selected", "prefer",
    "root cause", "workaround", "conclusion",
    # Chinese (for matching Chinese conversation content)
    "决策", "选型", "架构", "设计", "模式",
    "修复", "解决", "安装", "部署", "迁移",
    "重要", "记住", "记录", "方案", "权衡",
    "升级", "废弃", "流程", "发布",
]

[extract]
provider = "google"
inject_existing_context = false  # inject prior memory summaries into extraction prompts (opt-in)

[extract.google]
model = "gemini-3.1-flash-lite-preview"
max_input_chars = 0   # 0 = no truncation (1M token model). Set a limit if using a smaller model.
# endpoint defaults to "https://generativelanguage.googleapis.com"
# endpoint = "https://your-proxy.example.com"

[extract.omlx]
endpoint = "http://localhost:11434/v1"
model = "default"
max_input_chars = 16000  # ~4K-8K tokens, suitable for 7B-13B local models. Increase for larger models.
disable_thinking = true  # Prepend /no_think to system prompts (for Qwen3). Set false for other models.
# Works with any OpenAI-compatible server:
# Ollama (http://localhost:11434/v1), LM Studio (http://localhost:1234/v1),
# vLLM, LocalAI, text-generation-webui, etc.

[query_expansion]
provider = "google"           # "google", "omlx", or "none"
max_expansions = 3            # Number of query variants to generate

[query_expansion.google]
model = "gemini-3.1-flash-lite-preview"
# api_key auto-reads from GEMINI_API_KEY env
# endpoint defaults to "https://generativelanguage.googleapis.com"

[query_expansion.omlx]
endpoint = "http://localhost:8000/v1"
model = "default"
disable_thinking = true  # Prepend /no_think (for Qwen3). Set false for other models.
# Works with omlx serve, Ollama, LM Studio, etc.

[proxy]
port = 8690
bind = "127.0.0.1"
anthropic_upstream = "https://api.anthropic.com"
openai_upstream = "https://api.openai.com"
chatgpt_upstream = "https://chatgpt.com/backend-api"
codex_upstream = "https://chatgpt.com/backend-api/codex"
extract_enabled = true     # extract memories from assistant responses
store_min_chars = 220      # don't run proxy extraction on short assistant replies
store_min_score = 3        # pattern score required before proxy extraction runs
max_request_body = 1048576 # reject oversized client requests before forwarding
# v0.27.4 F5/C1: default-deny. Operators must opt in to unauthenticated
# loopback or set REIN_PROXY_TOKEN before running `rein proxy on`.
allow_unauthenticated_loopback = false

[async_memory]
provider = "inherit"       # inherit [extract].provider; can be "google", "omlx", or "none"
max_retries = 3            # retry failed async memory jobs before dead-lettering
base_backoff_ms = 2000     # retry backoff base (2s, 4s, 8s, ...)
max_jobs_per_run = 32      # worker drains up to this many jobs before exiting
batch_size = 8             # ready jobs processed per batch
spawn_cooldown_ms = 1500   # avoid spawn storms when many events arrive together
max_working_set_items = 40 # cap the per-project session working surface
max_always_on_items = 24   # cap the per-project stable always-on surface
selection_limit = 5        # max injected items selected across both surfaces
fingerprint_window_ms = 120000 # suppress near-duplicate queued events for 2 minutes
recent_event_cache_size = 256  # number of recent event fingerprints tracked per project

[cleanup]
skip_single_memory = true       # skip LLM for single-memory topic groups (prevents recursive nesting)
skip_short_content_chars = 500  # skip LLM for groups with total content under this char count
llm_batch_size = 8              # concurrent LLM calls per consolidation batch
llm_budget = 8                  # max LLM calls per dedup run (gray zone verdicts)
vec_dedup_strong_threshold = 0.80  # cosine sim above this → rule merge, no LLM
vec_dedup_weak_threshold = 0.70    # cosine sim below this → ignore
inter_batch_delay_ms = 200      # delay between LLM consolidation batches (ms)

[adaptive]
enabled = true                    # Adaptive engine: event logging active, learning loop pending closure
min_samples_alpha = 10            # Min accessed events per bucket before learning alpha
survival_cold_start = 20          # Min cluster samples for survival curve
tier_cold_start = 100             # Min memories before enabling Hot/Warm/Cold tiering
event_retention_days = 90         # How long to keep feedback events for replay
alpha_max_step = 0.15             # Max alpha change per GC cycle (prevents instability)
shrinkage_prior = 5.0             # Bayesian shrinkage strength for sparse buckets
